apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlstatx
  labels:
    app: hlstatx
spec:
  selector:
    matchLabels:
      app: hlstatx
  revisionHistoryLimit: 10
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hlstatx
    spec:
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hlstatx-daemon
        image: ghcr.io/nide-gg/hlstatsx-deamon:latest
        imagePullPolicy: Always
        # Measured 2026-11-15 (image of this branch, MariaDB 10.11, test database):
        # 32 MiB idle. Players and servers are held in memory, so a busy daemon needs
        # more: the limit leaves room for that. No CPU limit, throttling would delay
        # reading the UDP log stream.
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: hlstatx-daemon
          containerPort: 32578
          hostPort: 32578
          protocol: UDP
        env:
        - name: DB_NAME
          value: $DB_NAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hlstatsx-db
              key: DB_PASSWORD
        - name: DB_USERNAME
          value: $DB_USERNAME
        - name: DB_HOST
          value: $DB_HOST
