apiVersion: batch/v1
kind: CronJob
metadata:
  name: hlstatx-daemon-awards
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      creationTimestamp: null
    spec:
      activeDeadlineSeconds: 300
      template:
        spec:
          containers:
          - command:
            - docker-hlxce-awards
            env:
            - name: DB_HOST
              value: $DB_HOST
            - name: DB_NAME
              value: $DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hlstatsx-db
                  key: DB_PASSWORD
            - name: DB_USERNAME
              value: $DB_USERNAME
            image: ghcr.io/nide-gg/hlstatsx-deamon:latest
            imagePullPolicy: Always
            name: hlstatx-daemon-awards
            resources: {}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              privileged: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 30
  schedule: 0 23 * * *
  successfulJobsHistoryLimit: 3
  suspend: false
