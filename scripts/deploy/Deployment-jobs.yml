apiVersion: batch/v1
kind: CronJob
metadata:
  name: hlstatx-daemon-awards
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      creationTimestamp: null
    spec:
      activeDeadlineSeconds: 300
      template:
        spec:
          containers:
          - command:
            - docker-hlxce-awards
            env:
            - name: DB_HOST
              value: $DB_HOST
            - name: DB_NAME
              value: $DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hlstatsx-db
                  key: DB_PASSWORD
            - name: DB_USERNAME
              value: $DB_USERNAME
            image: ghcr.io/nide-gg/hlstatsx-deamon:latest
            imagePullPolicy: Always
            name: hlstatx-daemon-awards
            # Measured 2026-11-15 (image of this branch, MariaDB 10.11, test database):
            # 20 MiB peak RSS. The work is done by the database; the limit leaves room
            # for result sets of a large install. No CPU limit (it runs once a day).
            resources:
              requests:
                cpu: 50m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 30
  schedule: 0 23 * * *
  successfulJobsHistoryLimit: 3
  suspend: false
