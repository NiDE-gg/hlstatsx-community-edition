name: Dockerfile

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/dockerfile-lint.yml"
  push:
    branches: ["master"]
    paths:
      - "scripts/Dockerfile"
      - ".github/workflows/dockerfile-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: scripts/Dockerfile
          failure-threshold: error

  build:
    name: Build daemon image (no push)
    # master is built and pushed by docker-build-push.yml; on pull requests, only check that it builds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./scripts
          push: false
          tags: hlstatsx-daemon:ci
