name: Release

on:
  push:
    branches: ["master"]
    paths:
      - "sql/install.sql"
  workflow_dispatch:

# Each job asks for what it needs: only the last one can write to the repository
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile plugins
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version from install.sql
        id: version
        run: |
          version=$(sed -nE 's/^SET @VERSION *= *"?([^"]+)"?.*/\1/p' sql/install.sql | head -n1)
          if [ -z "$version" ]; then
            echo "::error file=sql/install.sql::Could not find SET @VERSION in sql/install.sql"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SourcePawn compiler
        if: steps.check.outputs.exists == 'false'
        uses: rumblefrog/setup-sp@1b616aebc2c70430364571e2b4ad4b719164c1f7 # v1.3.1
        with:
          version: "1.12.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile SourceMod plugins
        if: steps.check.outputs.exists == 'false'
        working-directory: sourcemod/scripting
        run: |
          mkdir -p "$RUNNER_TEMP/sourcemod-plugins"
          status=0
          for plugin in *.sp; do
            echo "::group::${plugin}"
            if ! spcomp -iinclude -o"$RUNNER_TEMP/sourcemod-plugins/${plugin%.sp}.smx" "$plugin"; then
              echo "::error file=sourcemod/scripting/${plugin}::${plugin} failed to compile"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload compiled plugins
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sourcemod-plugins
          path: ${{ runner.temp }}/sourcemod-plugins/*.smx
          if-no-files-found: error

  # Third-party actions (the compiler setup) run in the job above, without write access.
  # This job only runs GitHub's own download action and the gh CLI.
  release:
    name: Create release
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compiled plugins
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sourcemod-plugins
          path: sourcemod-plugins

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" sourcemod-plugins/*.smx \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
