name: Release

on:
  push:
    branches: ["master"]
    paths:
      - "sql/install.sql"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version from install.sql
        id: version
        run: |
          version=$(sed -nE 's/^SET @VERSION *= *"?([^"]+)"?.*/\1/p' sql/install.sql | head -n1)
          if [ -z "$version" ]; then
            echo "::error file=sql/install.sql::Could not find SET @VERSION in sql/install.sql"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SourcePawn compiler
        if: steps.check.outputs.exists == 'false'
        uses: rumblefrog/setup-sp@v1.3.1
        with:
          version: "1.12.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile SourceMod plugins
        if: steps.check.outputs.exists == 'false'
        working-directory: sourcemod/scripting
        run: |
          mkdir -p "$RUNNER_TEMP/sourcemod-plugins"
          status=0
          for plugin in *.sp; do
            echo "::group::${plugin}"
            if ! spcomp -iinclude -o"$RUNNER_TEMP/sourcemod-plugins/${plugin%.sp}.smx" "$plugin"; then
              echo "::error file=sourcemod/scripting/${plugin}::${plugin} failed to compile"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ runner.temp }}/sourcemod-plugins/*.smx
