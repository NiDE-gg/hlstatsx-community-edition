name: PHP lint

on:
  pull_request:
    paths:
      - "**/*.php"
      - ".github/workflows/php-lint.yml"
  push:
    branches: ["master"]
    paths:
      - "**/*.php"
      - ".github/workflows/php-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint PHP files
        run: |
          status=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! output=$(php -d display_errors=stderr -d error_reporting=E_ALL -l "$file" 2>&1); then
              line=$(printf '%s\n' "$output" | sed -nE 's/.* on line ([0-9]+).*/\1/p' | head -n1)
              message=$(printf '%s\n' "$output" | grep -m1 -i 'error' || printf '%s\n' "$output" | head -n1)
              echo "::error file=${file},line=${line:-1}::${message}"
              status=1
            fi
          done < <(git ls-files -z -- '*.php')
          echo "Checked ${count} PHP files."
          exit "$status"
