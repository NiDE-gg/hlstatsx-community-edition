name: Docker Build and Push

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# The token only needs to read the code and push the image
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build date
      id: meta
      run: echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./scripts
        push: true
        # The commit tag lets a deployment pin or roll back to an exact build
        tags: |
          ghcr.io/nide-gg/hlstatsx-deamon:latest
          ghcr.io/nide-gg/hlstatsx-deamon:${{ github.sha }}
        build-args: |
          BUILD_COMMIT=${{ github.sha }}
          BUILD_DATE=${{ steps.meta.outputs.date }}
        # Optional: when set, the image gets the current GeoLite2-City database
        secrets: |
          maxmind_license_key=${{ secrets.MAXMIND_LICENSE_KEY }}
